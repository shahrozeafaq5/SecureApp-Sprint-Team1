name: DevSecOps CI/CD Security Pipeline

on:
  push:
    branches: [ "main", "develop", "feature/*", "fix/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Functional Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Build Tools (GCC & Libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Native C Component (with Stack Canary Protection)
        run: |
          gcc -g -O2 -Wall -Wextra -fstack-protector-strong -D_FORTIFY_SOURCE=2 native/metadata.c native/metadata_cli.c -o native/metadata_parser.exe
          gcc -g -O2 -Wall -Wextra -fstack-protector-strong native/metadata.c native/harness.c -o parser_secure.exe
          gcc -g -O0 -fstack-protector-all native/metadata_vulnerable.c native/harness.c -o parser_vulnerable.exe

      - name: Execute Native C Buffer Overflow Verification
        run: |
          ./parser_secure.exe
          # Verify vulnerable harness triggers stack canary detection
          ./parser_vulnerable.exe || echo "Vulnerable parser terminated by stack canary as expected (status $?)"

      - name: Run Application Unit Tests
        run: |
          python -m unittest tests/test_app_flow.py

      - name: Run Vulnerability Proof-of-Concept & Remediation Test Suite
        run: |
          python -m unittest tests/verify_all_vulnerabilities.py

  security-sast:
    name: SAST Security Gate (Bandit & Semgrep)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SAST Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST on Production Code (Fail on High/Critical)
        run: |
          echo "Scanning production application files for high/critical security flaws..."
          bandit -r app.py processor.py -lll -f txt -o reports_sast.txt
          cat reports_sast.txt

      - name: Export Bandit SARIF/JSON Report
        if: always()
        run: |
          bandit -r app.py processor.py -f json -o bandit-results.json || true

      - name: Upload SAST Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-results
          path: bandit-results.json

  security-dast:
    name: DAST Security Verification (Headers & OWASP ZAP Baseline)
    runs-on: ubuntu-latest
    needs: security-sast
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Launch Application in Background
        run: |
          python app.py &
          sleep 4

      - name: Verify Anti-Clickjacking & Security Headers
        run: |
          echo "Auditing HTTP Response Security Headers..."
          HEADERS=$(curl -s -I http://127.0.0.1:5000/)
          echo "$HEADERS"
          echo "$HEADERS" | grep -i "X-Frame-Options: DENY"
          echo "$HEADERS" | grep -i "Content-Security-Policy: default-src 'self'; frame-ancestors 'none';"
          echo "$HEADERS" | grep -i "X-Content-Type-Options: nosniff"
          echo "Security headers verified successfully!"
